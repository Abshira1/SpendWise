<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SpendWise</h1>
      <p>Track your spending. Stay within budget.</p>
    </header>

    <section id="budget-section">
      <h2>Monthly Budget</h2>
      <form id="budget-form">
        <input type="number" id="budget-input" placeholder="Set budget (KES)" min="1" required>
        <button type="submit">Set Budget</button>
      </form>
    </section>

    <section id="dashboard">
      <div class="card"><h3>Budget</h3><p id="budget-display">KES 0</p></div>
      <div class="card"><h3>Total Spent</h3><p id="total-display">KES 0</p></div>
      <div class="card"><h3>Remaining</h3><p id="remaining-display">KES 0</p></div>
      <div class="card"><h3>Expenses</h3><p id="count-display">0</p></div>
    </section>
    <p id="feedback" class="feedback">Set a budget to get started.</p>

    <section id="add-expense">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <input type="text" id="name" placeholder="Expense name" required>
        <input type="number" id="amount" placeholder="Amount (KES)" min="1" required>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section id="expenses-section">
      <h2>Your Expenses</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Category</th><th>Amount</th><th>Action</th></tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
      <p id="empty-msg">No expenses yet.</p>
    </section>

    <section id="category-summary">
      <h2>Spending by Category</h2>
      <ul id="category-list"></ul>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
