<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Budget Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <h1>My Budget Tracker</h1>
            <p>Track your income and expenses in one place.</p>
        </header>

        <section class="add-expense">
          <h2>Add Expense</h2>
          <form>
            <label for="expense-name">Expense name</label>
            <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries">

            <label for="expense-amount">Amount</label>
            <input type="number" id="expense-amount" name="expense-amount"placeholder="0.00">

            <label for="expense-category">Category</label>
            <select id="expense-category" name="expense-category">
                <option value="food">Food</option>
                <option value="transport">Transport</option>
                <option value="bills">Bills</option>
                <option value="other">Other</option> 
            </select>
                
            <button type="submit">Add Expense</button>
          </form>
        </section>

        <section class="your-expenses">
            <h2>Your Expenses</h2>
            <p>No expenses yet</p>
          </section>

    </body>
    </html>
